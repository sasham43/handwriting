<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Arca Poetica</title>

    <style>
        html, body { height: 100%; margin: 0; }

        #scroller {
            height: 100dvh;        /* fills the 640x360 projector */
            overflow-y: auto;
            scrollbar-width: none;
        }
        #scroller::-webkit-scrollbar { display: none; }
        body {
            /* position: absolute;
            inset: 0;
            overflow: hidden; */

            background: black;
            color: white;
        }
        #input {  
            position: absolute;
            top: -50px;
            left: -250px;
            opacity: 0;
            width: 0;
            height: 0;
        }
        #handwriting {
            /* caveat fonts */
            /* font-size: 64px; */

            /* tangerine fonts */
            font-size: 82px;
        }
        #menu {
            position: absolute;
            inset: 0;
            z-index: 50;
            background-color: rgba(0, 0, 0, 0.5);
            opacity: 0;
            display: flex;
            gap: 24px;

            display: grid;
            grid-template-columns: 1fr 1fr;
            align-items: center;
            justify-content: center;
            justify-items: center;

            transition: opacity 1s ease;
        }
        #menu.show-menu {
            opacity: 1;
        }
        #center-circle {
            position: absolute;
            width: 50px;
            height: 50px;
            background-color: white;
            border-radius: 100%;
        }
    </style>
</head>

<body>
    <input type="text" id="input" />
    <div id="content">
        <div id="scroller">
            <div id="handwriting"></div>
        </div>

        <div id="menu">
            <div id="menu-play-poem">1 play poem</div>
            <div id="menu-read-crystal">2 read crystal</div>
            <div id="menu-save-crystal">3 save crystal</div>
            <div id="menu-clear-poem">4 clear poem</div>


            <div id="center-circle"></div>
        </div>
    </div>

    <!-- Point this directly to your source JS file (NOT a bundled file!) -->
    <script type="module" src="/src/app.js"></script>
</body>

</html>
